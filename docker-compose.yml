# Docker Compose for running the Qdrant + pgvector backends locally during
# development. Used by the conformance test suite when the
# MNEME_TEST_QDRANT_URL / MNEME_TEST_PGVECTOR_DSN env vars are set.
#
# Quick start:
#
#     docker compose up -d
#
# Then in your .env (or shell):
#
#     MNEME_TEST_QDRANT_URL=http://localhost:6333
#     MNEME_TEST_PGVECTOR_DSN=postgresql://mneme:mneme@localhost:5433/mneme
#
# And run the full suite:
#
#     uv run pytest
#
# Without those env vars, the qdrant + pgvector branches in the conformance
# fixture skip cleanly. Memory + sqlite always run.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: mneme-qdrant
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - mneme_qdrant_data:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: mneme-pgvector
    environment:
      POSTGRES_USER: mneme
      POSTGRES_PASSWORD: mneme
      POSTGRES_DB: mneme
    ports:
      # Map to 5433 on the host so Mneme's pgvector container doesn't
      # collide with any local Postgres install on the default 5432.
      - "5433:5432"
    volumes:
      - mneme_pgvector_data:/var/lib/postgresql/data

volumes:
  mneme_qdrant_data:
  mneme_pgvector_data:
