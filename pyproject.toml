[project]
# PyPI name is "smolAmem" because "mneme" was already taken.
# The Python import name is still ``mneme`` (the wheel ships
# ``src/mneme/``, see ``[tool.hatch.build.targets.wheel]`` below) -
# same pattern as Pillow/PIL, pyyaml/yaml, python-dateutil/dateutil.
# Install: ``pip install smolAmem``
# Import:  ``import mneme``
name = "smolAmem"
version = "1.0.0"
description = "Mneme — multi-tier long-term memory for LLM agents (install: pip install smolAmem · import: import mneme)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashwin Ugale", email = "ugaleashwin@gmail.com" }]
keywords = ["llm", "memory", "agents", "rag", "vector-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# Backend extras (opt-in so the core install stays tiny).
sqlite = ["sqlite-vec>=0.1.6"]
qdrant = ["qdrant-client>=1.12"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

# Embedding-provider extras (each provider is opt-in).
openai = ["openai>=1.40"]

# Background scheduler (v0.3). Lazy-imported by MemoryManager.start_scheduler.
scheduler = ["apscheduler>=3.10"]

# Framework adapter extras (v0.5).
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]

# Token counting for context_for() budget packing.
tokens = ["tiktoken>=0.7"]

# Docs site (v0.7). mkdocs-material + mkdocstrings autogen.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.7",
]

[project.urls]
Homepage = "https://ashwinugale.github.io/smolAmem/"
Documentation = "https://ashwinugale.github.io/smolAmem/"
Repository = "https://github.com/ashwinugale/smolAmem"
Issues = "https://github.com/ashwinugale/smolAmem/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mneme"]

# ---------------------------------------------------------------------------
# uv: dev dependencies live in a separate group so end-users never install them.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Pulled in so the SQLite backend's conformance tests run in dev.
    # Users opt in to this dep via the `sqlite` extra above.
    "sqlite-vec>=0.1.6",
    # OpenAI SDK so the embeddings integration test can run when a key is set.
    # Users opt in via the `openai` extra above.
    "openai>=1.40",
    # Loads .env in tests/conftest.py. Library itself never auto-loads dotenv.
    "python-dotenv>=1.0",
    # APScheduler for v0.3 forgetting + scheduled consolidation. Users opt in
    # via the `scheduler` extra above.
    "apscheduler>=3.10",
    # v0.4 production backends. Conformance suite parametrises over both
    # when MNEME_TEST_QDRANT_URL / MNEME_TEST_PGVECTOR_DSN are set; otherwise
    # those params skip cleanly.
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # v0.5 framework adapters. Users opt in via the matching extras above.
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
    "tiktoken>=0.7",
    # v0.7 docs site. Users opt in via the `docs` extra above.
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.7",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff: lint + format in one tool. Config is opinionated but standard.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line-too-long — formatter handles it
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest: src layout means tests don't need sys.path tweaks if the package is
# installed via uv sync / uv pip install -e .
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",                  # short summary for all non-passing test outcomes
    "--strict-markers",     # unknown @pytest.mark.* fails the suite
    "--strict-config",      # unknown config keys fail the suite
]

# ---------------------------------------------------------------------------
# Mypy: gradual typing. Strict for our own code, lenient at the edges.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Third-party packages without type stubs (no ``py.typed`` marker).
# Methods called on these modules are treated as returning ``Any``. Add
# new entries here as new untyped deps land.
[[tool.mypy.overrides]]
module = [
    "sqlite_vec",
    "dotenv",
    "apscheduler",
    "apscheduler.schedulers.background",
    "qdrant_client",
    "qdrant_client.models",
    "pgvector",
    "pgvector.psycopg",
    "tiktoken",
]
ignore_missing_imports = true
